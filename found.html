<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Found Items</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Lost Items List</h2>
  <div id="itemsList"></div>

  <h3>Return Confirmation</h3>
  <form id="returnForm">
    <label>Item ID: <input type="number" id="itemId" required></label><br>
    <label>Finder Name: <input type="text" id="finderName" required></label><br>
    <label>Date of Return: <input type="date" id="returnDate" required></label><br>
    <label>Remarks: <input type="text" id="remarks"></label><br>
    <button type="submit">Confirm Return</button>
  </form>

  <a href="index.html">⬅ Back to Home</a>
  <script src="script.js"></script>
</body>
</html>
