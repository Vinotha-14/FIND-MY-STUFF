<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <h1>Welcome, To Find My Stuff 👛👜<span id="username"></span></h1>
  <nav>
    <button onclick="showSection('report')">Report Lost Item</button>
    <button onclick="showSection('search')">Search Items</button>
    <button onclick="showSection('claim')">Claim Items</button>
    <button onclick="showSection('settings')">User Settings</button>
  </nav>

  <div id="report" class="section">
  <h2>Report Lost Item</h2>
  <form id="reportForm">
    <label for="title">✏️ Item Title</label><br>
    <input type="text" id="title" placeholder="Item Title" required><br>

    <label for="description">📝 Description</label><br>
    <textarea id="description" placeholder="Description"></textarea><br>

    <label for="location">📍 Location</label><br>
    <input type="text" id="location" placeholder="Location" required><br>

    <label for="date">📅 Date</label><br>
    <input type="date" id="date" required><br>

    <label for="contact">📞 Contact Details</label><br>
    <input type="text" id="contact" placeholder="Phone or Email" required><br>

    <button type="submit">Report</button>
  </form>

  <!-- Message placeholder -->
  <p id="reportMessage"></p>
</div>


  <div id="search" class="section" style="display:none;">
    <h2>Search Items</h2>
    <input type="text" id="searchQuery" placeholder="Search...">
    <button onclick="searchItems()">Search</button>
    <div id="results"></div>
  </div>

  <div id="claim" class="section" style="display:none;">
    <h2>Claim Items</h2>
    <div id="claimList"></div>
  </div>

  <div id="settings" class="section" style="display:none;">
    <h2>User Settings</h2>
    <div id="profile"></div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
