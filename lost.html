<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report Lost Item</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Report Lost Item</h2>
  <form id="lostForm">
    <label>Item Name: <input type="text" id="name" required></label><br>
    <label>Description: <input type="text" id="description" required></label><br>
    <label>Location Lost: <input type="text" id="location" required></label><br>
    <label>Date Lost: <input type="date" id="date" required></label><br>
    <label>Contact: <input type="text" id="contact" required></label><br>
    <button type="submit">Submit</button>
  </form>
  <a href="index.html">⬅ Back to Home</a>

  <script src="script.js"></script>
</body>
</html>
